version: 2

# Cooldown: only propose updates for versions that have been published for at
# least 14 days. Filters out same-day regressions and yanked releases.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#cooldown
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: docker
    # Scans both Dockerfile and Dockerfile.tools at the repo root.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps"
      include: scope
